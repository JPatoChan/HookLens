name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore HookLens.slnx

      - name: Build solution
        run: dotnet build HookLens.slnx --configuration Release --no-restore

      - name: Run test suite
        run: dotnet test HookLens.slnx --configuration Release --no-build --logger "console;verbosity=minimal"
